<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>影视分镜工作流</title>
  <style>
    :root {
      --bg-1: #eaf0ff;
      --bg-2: #f5f8ff;
      --line: rgba(103, 122, 156, 0.24);
      --text: #111827;
      --muted: #5b667a;
      --primary: #2b6dff;
      --ok: #12b76a;
      --danger: #ef4444;
      --shadow: 0 14px 34px rgba(17, 27, 52, 0.12);
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(900px 520px at -8% -8%, rgba(110, 153, 255, 0.24), transparent 60%),
        radial-gradient(900px 520px at 110% -14%, rgba(180, 139, 255, 0.22), transparent 62%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      padding: 14px;
    }
    .app { max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 14px; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius-xl); background: rgba(255,255,255,.72); backdrop-filter: blur(18px) saturate(130%); -webkit-backdrop-filter: blur(18px) saturate(130%); box-shadow: var(--shadow); }
    .left { padding: 14px; max-height: calc(100vh - 28px); overflow: auto; }
    .right { padding: 16px; }
    h1 { margin: 0; font-size: 24px; }
    .sub { color: var(--muted); font-size: 13px; margin: 8px 0 0; line-height: 1.45; }
    .sec { margin-top: 14px; }
    .sec-title { font-size: 13px; color: #3b4a64; font-weight: 700; margin-bottom: 8px; }
    .preset-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .preset-card { border: 1px solid rgba(118,133,161,.32); border-radius: 12px; background: rgba(255,255,255,.82); overflow: hidden; cursor: pointer; transition: .15s ease; }
    .preset-card:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(18, 33, 65, 0.12); border-color: rgba(43,109,255,.34); }
    .preset-card.active { border-color: rgba(43,109,255,.52); box-shadow: 0 0 0 2px rgba(43,109,255,.16); background: rgba(227, 237, 255, .95); }
    .preset-cover { width: 100%; aspect-ratio: 16/9; background-size: cover; background-position: center; background-color: #e8efff; }
    .preset-meta { padding: 10px 10px 12px; font-size: 12px; color: #34435c; font-weight: 700; }
    .upload-area { border: 1px dashed rgba(118,133,161,.55); border-radius: 14px; min-height: 260px; background: rgba(255,255,255,.62); display: grid; place-items: center; text-align: center; padding: 12px; color: #556581; background-size: contain; background-repeat: no-repeat; background-position: center; cursor: zoom-in; }
    .row { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { border: 1px solid rgba(43,109,255,.34); border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 700; cursor: pointer; background: linear-gradient(180deg,#4093ff,#2b6dff); color: #fff; }
    .btn.light { color: #24324b; background: rgba(255,255,255,.9); border-color: rgba(118,133,161,.35); font-weight: 600; }
    .file { display: none; }
    textarea { width: 100%; min-height: 80px; border: 1px solid var(--line); border-radius: 12px; padding: 10px; resize: vertical; font-size: 13px; color: #23314a; background: rgba(255,255,255,.85); }
    input[type="text"], input[type="number"] { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font-size: 13px; color: #23314a; background: rgba(255,255,255,.85); }
    .status { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.7); padding: 10px; font-size: 13px; color: #475871; }
    .ok { color: var(--ok); font-weight: 700; }
    .danger { color: var(--danger); font-weight: 700; }
    .result-grid { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
    .result-item { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; cursor: pointer; transition: .15s ease; }
    .result-item:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(18,33,65,.1); }
    .result-item img { width: 100%; display: block; aspect-ratio: 3/4; object-fit: cover; }
    .result-time { padding: 6px 8px; font-size: 11px; color: #64748b; }
    .preview-modal { position: fixed; inset: 0; background: rgba(6,8,14,.72); display: none; align-items: center; justify-content: center; z-index: 99; padding: 14px; }
    .preview-modal.open { display: flex; }
    .preview-modal img { max-width: min(96vw, 1400px); max-height: 92vh; border-radius: 12px; }
    @media (max-width: 1100px) { .app { grid-template-columns: 1fr; } .left { max-height: none; } .preset-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 700px) { .preset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <div id="app" class="app">
    <aside class="panel left">
      <h1>影视分镜生成</h1>
      <div class="sub">上传参考图，输入故事主题和场景，AI 自动生成专业电影级分镜脚本与关键帧画面。</div>

      <section class="sec">
        <div class="sec-title">场景预设</div>
        <div class="preset-grid">
          <article class="preset-card" v-for="item in scenePresets" :key="item.key" :class="{active: selectedPreset===item.key}" @click="applyPreset(item)">
            <div class="preset-cover" :style="boxBg(item.cover)"></div>
            <div class="preset-meta">{{ item.label }}</div>
          </article>
        </div>
      </section>
    </aside>

    <main class="panel right">
      <section class="sec" style="margin-top:0;">
        <div class="sec-title">上传参考图</div>
        <div class="upload-area" :style="boxBg(imagePreview)" @click="openPreview(imagePreview)">
          <template v-if="!imagePreview">🎬 上传场景/人物参考图</template>
        </div>
        <div class="row">
          <label class="btn light" for="imageFile">上传参考图</label>
          <input class="file" id="imageFile" type="file" accept="image/*" @change="onImageChange" />
          <span>{{ imageName }}</span>
        </div>
      </section>

      <section class="sec">
        <div class="sec-title">故事主题</div>
        <input type="text" v-model="storyTheme" placeholder="例如：悬疑追车、浪漫约会、都市独白" />
      </section>

      <section class="sec">
        <div class="sec-title">场景描述</div>
        <textarea v-model="sceneDesc" placeholder="例如：女人在阳台闭目养神，旁边有烧水壶在冒着热气"></textarea>
      </section>

      <section class="sec">
        <div class="sec-title">分镜时长（秒）</div>
        <input type="number" v-model.number="duration" min="5" max="60" step="1" />
      </section>

      <section class="sec">
        <div class="row">
          <button class="btn" type="button" @click="runWorkflow">生成分镜</button>
          <button class="btn light" type="button" @click="window.location.href='./index.html'">返回首页</button>
        </div>
        <div class="status">
          <div>状态：<span :class="statusClass">{{ statusText }}</span></div>
          <div style="margin-top:4px;">taskId：{{ taskId || '-' }}</div>
        </div>
      </section>

      <section class="sec">
        <div class="sec-title">生成历史</div>
        <div class="result-grid" v-if="history.length">
          <div class="result-item" v-for="item in history" :key="item.id" @click="openPreview(item.url)">
            <img :src="item.url" alt="result" />
            <div class="result-time">{{ formatTime(item.createdAt) }}</div>
          </div>
        </div>
        <div v-else class="sub">暂无结果，先生成一组吧。</div>
      </section>
    </main>

    <div class="preview-modal" :class="{open: previewOpen}" @click="closePreview">
      <img :src="previewUrl" alt="预览" @click.stop />
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    const { createApp } = Vue;
    createApp({
      data() {
        return {
          RH: {
            baseUrl: '',
            uploadPath: '/api/upload',
            createPath: '/api/create',
            outputsPath: '/api/outputs',
            workflowId: '2052770584093835266',
            imageNodeId: '442',
            imageFieldName: 'image',
            themeNodeId: '401',
            themeFieldName: 'text',
            sceneNodeId: '412',
            sceneFieldName: 'text',
            durationNodeId: '413',
            durationFieldName: 'text',
            apiKey: ''
          },
          scenePresets: [
            { key: 'romantic', label: '浪漫爱情', theme: '浪漫爱情', scene: '男女主角在雨中的街角相遇，共撑一把伞', duration: 15, cover: 'https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=700&q=80' },
            { key: 'suspense', label: '悬疑追车', theme: '悬疑追车', scene: '夜晚城市街道，黑色轿车高速穿过霓虹灯下的十字路口', duration: 15, cover: 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=700&q=80' },
            { key: 'solo', label: '都市独白', theme: '都市独白', scene: '女人在阳台闭目养神，旁边有烧水壶在冒着热气', duration: 15, cover: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=700&q=80' },
            { key: 'food', label: '美食治愈', theme: '美食治愈', scene: '厨师在开放式厨房精心摆盘，暖色灯光，蒸汽缭绕', duration: 15, cover: 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=700&q=80' },
            { key: 'adventure', label: '冒险探索', theme: '冒险探索', scene: '背包客站在悬崖边眺望远方山谷，晨光穿透云层', duration: 15, cover: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80' },
            { key: 'scifi', label: '科幻未来', theme: '科幻未来', scene: '宇航员在空间站透过舷窗凝视地球，全息投影闪烁', duration: 15, cover: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=700&q=80' }
          ],
          selectedPreset: 'solo',
          storyTheme: '都市独白',
          sceneDesc: '女人在阳台闭目养神，旁边有烧水壶在冒着热气',
          duration: 15,
          imageFile: null, imagePreview: '', imageName: '未选择参考图',
          status: 'ready', statusText: 'READY', taskId: '',
          history: [], previewOpen: false, previewUrl: ''
        };
      },
      computed: {
        statusClass() { return this.status === 'success' ? 'ok' : this.status === 'failed' ? 'danger' : ''; }
      },
      methods: {
        boxBg(url) { return url ? { backgroundImage: `url(${url})` } : {}; },
        applyPreset(preset) {
          this.selectedPreset = preset.key;
          this.storyTheme = preset.theme;
          this.sceneDesc = preset.scene;
          this.duration = preset.duration;
        },
        getApiKey() { return ''; },
        async parseJsonSafe(resp) { const t = await resp.text(); try { return JSON.parse(t); } catch(_) { return { raw: t }; } },
        async uploadFileToRunningHub(file) {
          const form = new FormData(); form.append('file', file); form.append('fileType', 'input');
          const res = await fetch(`${this.RH.baseUrl}${this.RH.uploadPath}`, { method: 'POST', body: form });
          const data = await this.parseJsonSafe(res); if (!res.ok) throw new Error(`上传失败(${res.status})`);
          return data?.data?.fileUrl || data?.data?.fileName || data?.data?.filename || data?.data?.download_url || data?.data?.downloadUrl || '';
        },
        async createTask(nodeInfoList) {
          const res = await fetch(`${this.RH.baseUrl}${this.RH.createPath}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ workflowId: this.RH.workflowId, nodeInfoList }) });
          const data = await this.parseJsonSafe(res); if (!res.ok || data?.code !== 0) throw new Error(`创建任务失败: ${JSON.stringify(data)}`);
          return data?.data?.taskId || '';
        },
        async pollOutputs(taskId) {
          for (let i = 0; i < 1200; i++) {
            const res = await fetch(`${this.RH.baseUrl}${this.RH.outputsPath}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ taskId }) });
            const data = await this.parseJsonSafe(res); if (!res.ok) throw new Error(`查询失败(${res.status})`);
            if (data?.code === 0 && Array.isArray(data?.data) && data.data.length > 0) { const urls = []; (function walk(x) { if (!x) return; if (typeof x === 'string' && /^https?:\/\//i.test(x)) { urls.push(x); return; } if (Array.isArray(x)) x.forEach(walk); else if (typeof x === 'object') Object.values(x).forEach(walk); })(data); return urls; }
            if (data?.code === 805) throw new Error(`任务失败: ${JSON.stringify(data)}`);
            await new Promise(r => setTimeout(r, 3000));
          }
          throw new Error('轮询超时');
        },
        onImageChange(e) {
          const f = e.target.files && e.target.files[0]; this.imageFile = f || null; this.imageName = f ? f.name : '未选择参考图';
          if (!f) return; if (this.imagePreview && this.imagePreview.startsWith('blob:')) URL.revokeObjectURL(this.imagePreview); this.imagePreview = URL.createObjectURL(f);
        },
        async runWorkflow() {
          try {
            if (!this.imageFile) throw new Error('请先上传参考图');
            if (!this.storyTheme.trim()) throw new Error('请输入故事主题');
            if (!this.sceneDesc.trim()) throw new Error('请输入场景描述');
            this.status = 'running'; this.statusText = 'RUNNING'; this.taskId = '';
            const imageRef = await this.uploadFileToRunningHub(this.imageFile);
            const nodeInfoList = [
              { nodeId: this.RH.imageNodeId, fieldName: this.RH.imageFieldName, fieldValue: imageRef },
              { nodeId: this.RH.themeNodeId, fieldName: this.RH.themeFieldName, fieldValue: `故事主主题是${this.storyTheme.trim()}` },
              { nodeId: this.RH.sceneNodeId, fieldName: this.RH.sceneFieldName, fieldValue: this.sceneDesc.trim() },
              { nodeId: this.RH.durationNodeId, fieldName: this.RH.durationFieldName, fieldValue: String(this.duration) }
            ];
            const taskId = await this.createTask(nodeInfoList); this.taskId = taskId;
            const urls = await this.pollOutputs(taskId);
            const imageUrls = urls.filter(u => /\.(png|jpe?g|webp|gif)(\?|$)/i.test(u));
            // 分镜可能生成多张图，全部保存
            if (imageUrls.length === 0 && urls.length === 0) throw new Error('未返回结果');
            const newItems = (imageUrls.length ? imageUrls : urls).map((url, i) => ({
              id: `${Date.now()}_${i}_${Math.random().toString(36).slice(2,8)}`, url, createdAt: Date.now()
            }));
            this.history = [...newItems, ...this.history].slice(0, 60);
            this.status = 'success'; this.statusText = 'SUCCESS';
          } catch (e) { this.status = 'failed'; this.statusText = e.message || String(e); }
        },
        openPreview(url) { if (!url) return; this.previewUrl = url; this.previewOpen = true; },
        closePreview() { this.previewOpen = false; this.previewUrl = ''; },
        formatTime(ts) { const d = new Date(ts); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
      },
      mounted() { window.addEventListener('keydown', e => { if (e.key === 'Escape') this.closePreview(); }); }
    }).mount('#app');
  </script>
</body>
</html>
