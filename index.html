<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIHub - AI 应用</title>
  <style>
    :root {
      --bg-1: #f4f7ff; --bg-2: #e8eefb;
      --glass: rgba(255, 255, 255, 0.58); --glass-strong: rgba(255, 255, 255, 0.76);
      --line: rgba(107, 123, 152, 0.16);
      --text: #0f1728; --muted: #677489;
      --primary: #3a7bff; --primary-light: rgba(58, 123, 255, 0.12);
      --success: #22c55e; --error: #ef4444; --warning: #f59e0b;
      --shadow: 0 14px 34px rgba(28, 40, 68, 0.10);
      --radius-xl: 22px; --radius-lg: 16px; --radius-md: 12px;
      --top-h: 68px; --left-w: 230px;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; color: var(--text);
      font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 620px at -8% -10%, rgba(158, 196, 255, 0.42), transparent 56%),
        radial-gradient(980px 560px at 105% -18%, rgba(204, 182, 255, 0.30), transparent 58%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    }
    .app { width: 100%; height: 100%; display: grid; grid-template-rows: var(--top-h) minmax(0, 1fr); gap: 14px; padding: 12px; }

    /* 顶栏 */
    .topbar { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; min-width: 0;
      border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--glass);
      backdrop-filter: blur(18px) saturate(130%); box-shadow: var(--shadow); padding: 10px 14px; }
    .top-left { min-width: 0; display: flex; align-items: center; gap: 10px; }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: 0.2px; white-space: nowrap; cursor: pointer; }
    .search { width: min(420px, 45vw); min-width: 140px; height: 40px; border-radius: 999px;
      border: 1px solid rgba(124, 138, 164, 0.22); background: rgba(255, 255, 255, 0.72);
      color: #344054; font-size: 14px; padding: 0 14px; outline: none; }
    .search:focus { border-color: rgba(47, 107, 255, 0.36); box-shadow: 0 0 0 3px rgba(47, 107, 255, 0.12); }
    .hero-chip { justify-self: center; border: 1px solid rgba(99, 115, 142, 0.2);
      background: rgba(255, 255, 255, 0.78); border-radius: 999px; padding: 8px 14px;
      font-size: 13px; color: #344054; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 46vw; }
    .top-right { justify-self: end; display: flex; align-items: center; gap: 8px; }
    .pill { border: 1px solid rgba(47, 107, 255, 0.26); border-radius: 999px; height: 34px; padding: 0 12px;
      display: inline-flex; align-items: center; font-size: 13px; color: #1f4fd1;
      background: rgba(255, 255, 255, 0.85); font-weight: 600; cursor: pointer; }
    .icon-dot { width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid rgba(123, 136, 162, 0.24); background: rgba(255, 255, 255, 0.85); cursor: pointer; }

    /* 布局 */
    .layout { min-height: 0; display: grid; grid-template-columns: var(--left-w) minmax(0, 1fr); gap: 14px; }
    .sidebar { border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--glass);
      backdrop-filter: blur(18px) saturate(130%); box-shadow: var(--shadow);
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 12px; min-height: 0; overflow: auto; }
    .side-group { display: grid; gap: 6px; }
    .item { width: 100%; border: 1px solid transparent; background: transparent; color: #475467;
      font-size: 14px; border-radius: 12px; padding: 10px 12px; text-align: left;
      cursor: pointer; white-space: nowrap; transition: .15s ease; }
    .item:hover { background: rgba(255, 255, 255, 0.72); border-color: rgba(123, 136, 162, 0.18); }
    .item.active { color: #12358f; border-color: rgba(47, 107, 255, 0.24);
      background: linear-gradient(145deg, rgba(210, 227, 255, 0.82), rgba(233, 240, 255, 0.92)); font-weight: 600; }
    .workspace-btn { margin-top: 10px; border: 1px solid rgba(123, 136, 162, 0.22); border-radius: 12px;
      background: rgba(255, 255, 255, 0.78); color: #475467; font-size: 13px; padding: 10px 0; text-align: center; cursor: pointer; }

    /* 主内容 */
    .main { min-width: 0; min-height: 0; overflow: auto; padding: 4px; }
    .section { margin-bottom: 14px; border: 1px solid var(--line); border-radius: var(--radius-xl);
      background: var(--glass-strong); backdrop-filter: blur(16px) saturate(128%);
      box-shadow: var(--shadow); padding: 14px; }
    .section-title { font-size: 16px; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.1px; }
    .section-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 12px; }

    /* 卡片通用 */
    .apps-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
    .mini-card { border: 1px solid rgba(123, 136, 162, 0.22); border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.82); min-height: 94px; display: grid;
      grid-template-columns: 1fr auto; gap: 12px; align-items: center; overflow: hidden;
      box-shadow: 0 6px 18px rgba(17, 24, 39, 0.08); padding: 12px 12px 12px 14px; }
    .clickable { cursor: pointer; transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease; }
    .clickable:hover { transform: translateY(-1px); border-color: rgba(47, 107, 255, 0.25); box-shadow: 0 10px 24px rgba(18, 44, 96, 0.14); }
    .mini-card h4 { margin: 0; font-size: 18px; font-weight: 700; color: #101828; line-height: 1.2; }
    .mini-card p { margin: 6px 0 0; font-size: 13px; color: #667085; line-height: 1.35; }
    .thumb { width: 86px; height: 62px; border-radius: 12px;
      border: 1px solid rgba(123, 136, 162, 0.2); overflow: hidden; background: #edf2ff; flex-shrink: 0; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* 标签 */
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .tag { border: 1px solid rgba(123, 136, 162, 0.22); background: rgba(255, 255, 255, 0.8);
      color: #667085; border-radius: 999px; padding: 7px 11px; font-size: 12px; line-height: 1;
      cursor: pointer; user-select: none; transition: .15s ease; }
    .tag.active { color: #1748bf; border-color: rgba(47, 107, 255, 0.28); background: rgba(222, 234, 255, 0.9); font-weight: 600; }

    /* 工作流卡片 */
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 10px; }
    .card { border: 1px solid rgba(123, 136, 162, 0.22); border-radius: var(--radius-lg); overflow: hidden;
      background: rgba(255, 255, 255, 0.84); box-shadow: 0 6px 18px rgba(17, 24, 39, 0.08); }
    .cover { aspect-ratio: 3 / 4; background: #eef3ff; overflow: hidden; }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .meta { padding: 10px; font-size: 13px; color: #475467; line-height: 1.3; font-weight: 600; }

    /* Mock 特性卡片 */
    .mock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
    .mock-card { border: 1px solid rgba(123, 136, 162, 0.22); border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.84); box-shadow: 0 6px 18px rgba(17, 24, 39, 0.08);
      padding: 14px; min-height: 120px; display: flex; flex-direction: column;
      justify-content: space-between; gap: 8px; cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
    .mock-card:hover { transform: translateY(-1px); border-color: rgba(47, 107, 255, 0.24); box-shadow: 0 10px 24px rgba(18, 44, 96, 0.14); }
    .mock-card.active { border-color: rgba(47, 107, 255, 0.34);
      background: linear-gradient(145deg, rgba(214, 229, 255, 0.88), rgba(238, 244, 255, 0.95)); }
    .mock-card-title { font-size: 15px; font-weight: 700; color: #101828; }
    .mock-card-desc { font-size: 13px; color: #667085; line-height: 1.4; }
    .mock-panel { border: 1px solid rgba(123, 136, 162, 0.22); border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.84); box-shadow: 0 6px 18px rgba(17, 24, 39, 0.08); padding: 14px; }
    .mock-panel h4 { margin: 0 0 6px; font-size: 18px; }
    .mock-panel p { margin: 0; font-size: 14px; color: #475467; line-height: 1.45; }
    .mock-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    .mock-btn { border: 1px solid rgba(47, 107, 255, 0.26); border-radius: 999px; height: 34px;
      padding: 0 12px; display: inline-flex; align-items: center; font-size: 13px;
      color: #1f4fd1; background: rgba(255, 255, 255, 0.9); font-weight: 600; cursor: pointer; }
    .empty-pane { min-height: 230px; border: 1px dashed rgba(123, 136, 162, 0.32);
      border-radius: var(--radius-lg); background: rgba(255, 255, 255, 0.5); }

    /* ====== 新增页面样式 ====== */

    /* 欢迎横幅 */
    .welcome-banner { display: flex; align-items: center; gap: 16px; padding: 20px;
      border: 1px solid var(--line); border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(58, 123, 255, 0.08), rgba(99, 102, 241, 0.08));
      margin-bottom: 14px; }
    .welcome-avatar { width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, #3a7bff, #6366f1); display: flex;
      align-items: center; justify-content: center; color: #fff; font-size: 22px; font-weight: 700; flex-shrink: 0; }
    .welcome-text h3 { margin: 0; font-size: 18px; font-weight: 700; }
    .welcome-text p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

    /* 统计卡片 */
    .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .stat-card { border: 1px solid var(--line); border-radius: var(--radius-lg);
      background: var(--glass-strong); padding: 14px; text-align: center; }
    .stat-num { font-size: 28px; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* 任务列表 */
    .task-list { display: flex; flex-direction: column; gap: 8px; }
    .task-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      border: 1px solid rgba(123, 136, 162, 0.18); border-radius: 10px;
      background: rgba(255, 255, 255, 0.7); transition: .15s; }
    .task-item:hover { background: rgba(255, 255, 255, 0.9); }
    .task-thumb { width: 48px; height: 48px; border-radius: 8px; background: #eef3ff;
      overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #a0aec0; }
    .task-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .task-info { flex: 1; min-width: 0; }
    .task-info .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-info .time { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .task-badge { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .task-badge.success { background: rgba(34, 197, 94, 0.12); color: #16a34a; }
    .task-badge.running { background: rgba(58, 123, 255, 0.12); color: #3a7bff; }
    .task-badge.failed { background: rgba(239, 68, 68, 0.12); color: #ef4444; }
    .task-badge.pending { background: rgba(245, 158, 11, 0.12); color: #d97706; }

    /* 排行榜 */
    .rank-list { display: flex; flex-direction: column; gap: 8px; }
    .rank-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      border: 1px solid rgba(123, 136, 162, 0.18); border-radius: 10px;
      background: rgba(255, 255, 255, 0.7); cursor: pointer; transition: .15s; }
    .rank-item:hover { background: rgba(255, 255, 255, 0.9); border-color: rgba(47, 107, 255, 0.2); }
    .rank-num { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0; }
    .rank-num.gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #fff; }
    .rank-num.silver { background: linear-gradient(135deg, #d1d5db, #9ca3af); color: #fff; }
    .rank-num.bronze { background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; }
    .rank-num.normal { background: rgba(0,0,0,0.04); color: var(--muted); }
    .rank-info { flex: 1; }
    .rank-info .name { font-size: 14px; font-weight: 600; }
    .rank-info .desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .rank-uses { font-size: 12px; color: var(--muted); }

    /* 套餐卡片 */
    .plan-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .plan-card { border: 1px solid var(--line); border-radius: var(--radius-lg);
      background: var(--glass-strong); padding: 20px; text-align: center; position: relative; }
    .plan-card.current { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .plan-card.current::after { content: '当前'; position: absolute; top: 10px; right: 10px;
      background: var(--primary); color: #fff; font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 999px; }
    .plan-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .plan-price { font-size: 32px; font-weight: 800; color: var(--primary); }
    .plan-price span { font-size: 14px; font-weight: 400; color: var(--muted); }
    .plan-features { margin-top: 14px; text-align: left; }
    .plan-features li { font-size: 13px; color: #475467; padding: 4px 0; list-style: none; }
    .plan-features li::before { content: '\2713'; color: var(--success); font-weight: 700; margin-right: 6px; }
    .plan-btn { margin-top: 14px; width: 100%; height: 40px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer; }
    .plan-btn.primary { background: linear-gradient(135deg, #3a7bff, #6366f1); color: #fff; }
    .plan-btn.outline { background: transparent; border: 1px solid var(--line); color: var(--text); }

    /* 个人中心 */
    .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .profile-avatar { width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, #3a7bff, #6366f1); display: flex;
      align-items: center; justify-content: center; color: #fff; font-size: 28px; font-weight: 700; }
    .profile-name { font-size: 22px; font-weight: 700; }
    .profile-email { font-size: 14px; color: var(--muted); }
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: 13px; font-weight: 600; color: #475467; margin-bottom: 4px; }
    .form-row input, .form-row select { width: 100%; height: 40px; border: 1px solid rgba(124, 138, 164, 0.28);
      border-radius: 10px; background: rgba(255, 255, 255, 0.82); padding: 0 12px;
      font-size: 14px; color: var(--text); outline: none; }
    .form-row input:focus, .form-row select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .form-row textarea { width: 100%; height: 80px; border: 1px solid rgba(124, 138, 164, 0.28);
      border-radius: 10px; background: rgba(255, 255, 255, 0.82); padding: 10px 12px;
      font-size: 14px; color: var(--text); outline: none; resize: vertical; }
    .save-btn { height: 40px; padding: 0 24px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #3a7bff, #6366f1); color: #fff;
      font-size: 14px; font-weight: 700; cursor: pointer; }
    .danger-btn { height: 40px; padding: 0 24px; border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 10px; background: rgba(239, 68, 68, 0.06); color: var(--error);
      font-size: 14px; font-weight: 600; cursor: pointer; margin-left: 10px; }

    /* API 代码块 */
    .code-block { background: #1e293b; color: #e2e8f0; border-radius: 10px; padding: 14px;
      font-family: "Fira Code", "SF Mono", monospace; font-size: 13px; line-height: 1.6;
      overflow-x: auto; white-space: pre; margin: 10px 0; }
    .code-block .kw { color: #c084fc; }
    .code-block .str { color: #86efac; }
    .code-block .cm { color: #64748b; }

    /* 公告 */
    .notice { padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(245, 158, 11, 0.2);
      background: rgba(245, 158, 11, 0.06); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .notice-icon { font-size: 16px; }
    .notice-text { font-size: 13px; color: #475467; flex: 1; }
    .notice-time { font-size: 11px; color: #98a2b3; white-space: nowrap; }

    /* 登录弹窗 */
    .login-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(6px);
      z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .login-modal { width: min(420px, 90vw); border: 1px solid var(--line); border-radius: var(--radius-xl);
      background: var(--glass-strong); backdrop-filter: blur(20px); box-shadow: 0 24px 48px rgba(15, 23, 42, 0.2);
      padding: 32px; text-align: center; }
    .login-modal h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .login-modal .login-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
    .wechat-qr-area { width: 200px; height: 200px; margin: 0 auto 20px; border: 1px solid var(--line);
      border-radius: var(--radius-lg); background: #fff; display: flex; align-items: center;
      justify-content: center; overflow: hidden; }
    .wechat-qr-area iframe { border: none; width: 100%; height: 100%; }
    .wechat-qr-area .qr-placeholder { color: #07c160; font-size: 48px; }
    .login-btn { width: 100%; height: 48px; border: none; border-radius: 12px; font-size: 16px;
      font-weight: 700; cursor: pointer; margin-bottom: 10px; transition: .15s; }
    .login-btn:hover { transform: translateY(-1px); }
    .login-btn.wechat { background: #07c160; color: #fff; }
    .login-btn.dev { background: rgba(0,0,0,0.04); color: var(--muted); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
    .login-close { position: absolute; top: 12px; right: 16px; font-size: 20px; color: var(--muted);
      cursor: pointer; border: none; background: none; }
    .login-divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: #98a2b3; font-size: 12px; }
    .login-divider::before, .login-divider::after { content: ''; flex: 1; height: 1px; background: rgba(0,0,0,0.08); }
    .login-dev-input { width: 100%; height: 40px; border: 1px solid rgba(124, 138, 164, 0.28);
      border-radius: 10px; background: rgba(255, 255, 255, 0.82); padding: 0 12px;
      font-size: 14px; color: var(--text); outline: none; margin-bottom: 10px; }
    .login-dev-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }

    /* 顶栏用户状态 */
    .user-chip { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 10px;
      border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.7);
      font-size: 13px; font-weight: 600; color: #344054; transition: .15s; }
    .user-chip:hover { background: rgba(255,255,255,0.9); }
    .user-chip .avatar { width: 24px; height: 24px; border-radius: 50%;
      background: linear-gradient(135deg, #3a7bff, #6366f1); display: flex;
      align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; }
    .user-chip .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

    .hidden { display: none !important; }

    @media (max-width: 1080px) {
      .layout { grid-template-columns: 88px minmax(0, 1fr); }
      .item { font-size: 12px; padding: 10px 8px; }
      .workspace-btn { font-size: 12px; }
    }
    @media (max-width: 860px) {
      .app { grid-template-rows: auto minmax(0, 1fr); }
      .topbar { grid-template-columns: 1fr; gap: 8px; }
      .hero-chip { justify-self: start; max-width: 100%; }
      .top-right { justify-self: start; }
      .layout { grid-template-columns: 1fr; }
      .sidebar { flex-direction: row; overflow-x: auto; gap: 10px; align-items: center; }
      .side-group { display: flex; gap: 6px; }
      .workspace-btn { display: none; }
    }
    @media (max-width: 520px) {
      .brand { display: none; }
      .search { width: 100%; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="top-left">
        <div class="brand" @click="nav='首页'">AIHub</div>
        <input class="search" v-model="searchText" placeholder="搜索应用 / 工作流 / 模型" />
      </div>
      <div class="hero-chip">全能图片 G2 已上线 · 体验更快更清爽</div>
      <div class="top-right">
        <div class="pill" @click="nav='工作流'">开始创作</div>
        <template v-if="loggedInUser">
          <div class="user-chip" @click="nav='个人中心'">
            <div class="avatar"><img v-if="loggedInUser.avatar" :src="loggedInUser.avatar" /><span v-else>{{ loggedInUser.nickname.charAt(0) }}</span></div>
            <span>{{ loggedInUser.nickname }}</span>
          </div>
        </template>
        <template v-else>
          <div class="pill" @click="showLogin=true">登录</div>
        </template>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="side-group">
          <button class="item" :class="{active: nav==='首页'}" @click="nav='首页'">首页</button>

            digitalHuman: './workflow-canvas.html',
            digitalHumanLong: './workflow-canvas.html',
            imageGen: './workflow-canvas.html',
            tts: './workflow-canvas.html',
            bgChange: './bg-change-workflow.html',
            sketchNote: './sketch-note-workflow.html',
            storyboard: './storyboard-workflow.html',
            outfitPos: './outfit-pos-workflow.html',
            productBgConsistent: './workflow.html?type=productBgConsistent',
            ecommerceRetouch: './workflow.html?type=ecommerceRetouch',
            fashionModelVideo: './workflow.html?type=fashionModelVideo'
          };
          window.location.href = pageMap[key] || './workflow.html?type=' + key;
        },

        selectFeature(feature) { this.selectedFeature = feature; },
        fakeAction(actionName) {
          if (!this.selectedFeature) return;
          alert('【' + actionName + '】' + this.selectedFeature.title + '\n功能开发中，敬请期待。');
        },

        // 任务数据
        async fetchTasks() {
          try {
            const res = await fetch(`${API}/api/tasks?limit=50`);
            const data = await res.json();
            this.allTasks = data.tasks || [];
            this.recentTasks = this.allTasks.slice(0, 5);
          } catch (_) {
            this.allTasks = [];
            this.recentTasks = [];
          }
        },

        templateName(type) {
          const names = {
            digitalHuman: '数字人', digitalHumanLong: '数字人（长视频）',
            imageGen: '文生图', tts: 'TTS 文生声音',
            bgChange: '换背景加强版', sketchNote: '手绘注解',
            storyboard: '影视分镜', outfitPos: '穿搭大师POS',
            productBgConsistent: '产品一致性换背景', ecommerceRetouch: '电商万能精修',
            fashionModelVideo: '服装模特视频'
          };
          return names[type] || type;
        },

        statusLabel(status) {
          return { pending: '排队中', running: '生成中', success: '已完成', failed: '失败' }[status] || status;
        },

        formatTime(iso) {
          if (!iso) return '';
          const d = new Date(iso);
          const now = new Date();
          const diff = Math.floor((now - d) / 1000);
          if (diff < 60) return '刚刚';
          if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
          if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
          return d.getMonth() + 1 + '月' + d.getDate() + '日 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        },

        // 个人中心
        saveProfile() {
          localStorage.setItem('aihub_username', this.userName);
          localStorage.setItem('aihub_email', this.userEmail);
          localStorage.setItem('aihub_format', this.defaultFormat);
          alert('保存成功');
        },

        clearData() {
          if (!confirm('确定要清除所有本地数据吗？这将删除你的昵称、邮箱等偏好设置。')) return;
          localStorage.removeItem('aihub_username');
          localStorage.removeItem('aihub_email');
          localStorage.removeItem('aihub_format');
          this.userName = '创作者';
          this.userEmail = 'user@aihub.com';
          this.defaultFormat = 'auto';
          alert('已清除');
        },

        copyApiKey() {
          navigator.clipboard.writeText('sk-****...****').then(() => alert('已复制'));
        },

        // 登录相关
        async checkLogin() {
          try {
            const res = await fetch(`${API}/api/auth/me`);
            const data = await res.json();
            this.loggedInUser = data.loggedIn ? data.user : null;
            if (this.loggedInUser) {
              this.userName = this.loggedInUser.nickname;
            }
          } catch (_) {
            this.loggedInUser = null;
          }
        },

        async loadWechatQr() {
          try {
            const res = await fetch(`${API}/api/auth/wechat/url`);
            const data = await res.json();
            if (data.url) {
              this.wechatQrUrl = data.url;
            }
          } catch (err) {
            alert('获取微信登录链接失败，请使用开发模式登录');
          }
        },

        async devLogin() {
          const nickname = this.devNickname.trim() || '开发测试用户';
          try {
            const res = await fetch(`${API}/api/auth/dev-login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ nickname })
            });
            const data = await res.json();
            if (data.ok) {
              this.loggedInUser = data.user;
              this.userName = data.user.nickname;
              localStorage.setItem('aihub_username', data.user.nickname);
              this.showLogin = false;
            }
          } catch (err) {
            alert('登录失败: ' + err.message);
          }
        },

        async logout() {
          try {
            await fetch(`${API}/api/auth/logout`, { method: 'POST' });
          } catch (_) {}
          this.loggedInUser = null;
          this.userName = '创作者';
          this.nav = '首页';
        }
      },

      mounted() {
        const list = this.mockFeaturesMap[this.activeTag] || [];
        this.selectedFeature = list.length ? list[0] : null;
        this.fetchTasks();
        this.checkLogin();
      }
    }).mount('#app');
  </script>
</body>
</html>
