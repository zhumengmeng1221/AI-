<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手绘注解工作流</title>
  <style>
    :root {
      --bg-1: #eaf0ff;
      --bg-2: #f5f8ff;
      --line: rgba(103, 122, 156, 0.24);
      --text: #111827;
      --muted: #5b667a;
      --primary: #2b6dff;
      --ok: #12b76a;
      --danger: #ef4444;
      --shadow: 0 14px 34px rgba(17, 27, 52, 0.12);
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(900px 520px at -8% -8%, rgba(110, 153, 255, 0.24), transparent 60%),
        radial-gradient(900px 520px at 110% -14%, rgba(180, 139, 255, 0.22), transparent 62%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      padding: 14px;
    }

    .app {
      max-width: 1500px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 420px minmax(0, 1fr);
      gap: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(18px) saturate(130%);
      -webkit-backdrop-filter: blur(18px) saturate(130%);
      box-shadow: var(--shadow);
    }

    .left { padding: 14px; max-height: calc(100vh - 28px); overflow: auto; }
    .right { padding: 16px; }

    h1 { margin: 0; font-size: 24px; }
    .sub { color: var(--muted); font-size: 13px; margin: 8px 0 0; line-height: 1.45; }

    .sec { margin-top: 14px; }
    .sec-title { font-size: 13px; color: #3b4a64; font-weight: 700; margin-bottom: 8px; }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .preset-card {
      border: 1px solid rgba(118,133,161,.32);
      border-radius: 12px;
      background: rgba(255,255,255,.82);
      overflow: hidden;
      cursor: pointer;
      transition: .15s ease;
    }

    .preset-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(18, 33, 65, 0.12);
      border-color: rgba(43,109,255,.34);
    }

    .preset-card.active {
      border-color: rgba(43,109,255,.52);
      box-shadow: 0 0 0 2px rgba(43,109,255,.16);
      background: rgba(227, 237, 255, .95);
    }

    .preset-cover {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-size: cover;
      background-position: center;
      background-color: #e8efff;
    }

    .preset-meta {
      padding: 10px 10px 12px;
      font-size: 12px;
      color: #34435c;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .upload-area {
      border: 1px dashed rgba(118,133,161,.55);
      border-radius: 14px;
      min-height: 260px;
      background: rgba(255,255,255,.62);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 12px;
      color: #556581;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      cursor: zoom-in;
    }

    .row { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn {
      border: 1px solid rgba(43,109,255,.34);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(180deg,#4093ff,#2b6dff);
      color: #fff;
    }
    .btn.light {
      color: #24324b;
      background: rgba(255,255,255,.9);
      border-color: rgba(118,133,161,.35);
      font-weight: 600;
    }

    .file { display: none; }

    textarea {
      width: 100%;
      min-height: 160px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      resize: vertical;
      font-size: 13px;
      color: #23314a;
      background: rgba(255,255,255,.85);
    }

    .status {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.7);
      padding: 10px;
      font-size: 13px;
      color: #475871;
    }

    .ok { color: var(--ok); font-weight: 700; }
    .danger { color: var(--danger); font-weight: 700; }

    .result-grid { margin-top: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
    .result-item { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; cursor: pointer; transition: .15s ease; }
    .result-item:hover { transform: translateY(-1px); box-shadow: 0 6px 14px rgba(18,33,65,.1); }
    .result-item img { width: 100%; display: block; aspect-ratio: 3/4; object-fit: cover; }
    .result-time { padding: 6px 8px; font-size: 11px; color: #64748b; }

    .preview-modal {
      position: fixed;
      inset: 0;
      background: rgba(6,8,14,.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 99;
      padding: 14px;
    }
    .preview-modal.open { display: flex; }
    .preview-modal img { max-width: min(96vw, 1400px); max-height: 92vh; border-radius: 12px; }

    @media (max-width: 1100px) {
      .app { grid-template-columns: 1fr; }
      .left { max-height: none; }
      .preset-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 700px) {
      .preset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div id="app" class="app">
    <aside class="panel left">
      <h1>StarTed 手绘注解</h1>
      <div class="sub">上传照片，AI 自动为物品添加手绘风注解、描边轮廓和可爱文字标注。</div>

      <section class="sec">
        <div class="sec-title">注解风格预设</div>
        <div class="preset-grid">
          <article class="preset-card" v-for="item in stylePresets" :key="item.key" :class="{active: selectedStyle===item.key}" @click="selectedStyle=item.key">
            <div class="preset-cover" :style="boxBg(item.cover)"></div>
            <div class="preset-meta">{{ item.label }}</div>
          </article>
        </div>
      </section>
    </aside>

    <main class="panel right">
      <section class="sec" style="margin-top:0;">
        <div class="sec-title">上传照片</div>
        <div class="upload-area" :style="boxBg(imagePreview)" @click="openPreview(imagePreview)">
          <template v-if="!imagePreview">📷 点击预览，或点下方按钮上传照片</template>
        </div>
        <div class="row">
          <label class="btn light" for="imageFile">上传照片</label>
          <input class="file" id="imageFile" type="file" accept="image/*" @change="onImageChange" />
          <span>{{ imageName }}</span>
        </div>
      </section>

      <section class="sec">
        <div class="sec-title">注解提示词（可自定义微调）</div>
        <textarea v-model="promptText"></textarea>
        <div class="row">
          <button class="btn light" type="button" @click="resetPrompt">恢复默认提示词</button>
          <button class="btn" type="button" @click="runWorkflow">开始生成</button>
          <button class="btn light" type="button" @click="window.location.href='./index.html'">返回首页</button>
        </div>
        <div class="status">
          <div>状态：<span :class="statusClass">{{ statusText }}</span></div>
          <div style="margin-top:4px;">taskId：{{ taskId || '-' }}</div>
        </div>
      </section>

      <section class="sec">
        <div class="sec-title">生成历史</div>
        <div class="result-grid" v-if="history.length">
          <div class="result-item" v-for="item in history" :key="item.id" @click="openPreview(item.url)">
            <img :src="item.url" alt="result" />
            <div class="result-time">{{ formatTime(item.createdAt) }}</div>
          </div>
        </div>
        <div v-else class="sub">暂无结果，先生成一张吧。</div>
      </section>
    </main>

    <div class="preview-modal" :class="{open: previewOpen}" @click="closePreview">
      <img :src="previewUrl" alt="预览" @click.stop />
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    const { createApp } = Vue;

    const defaultPrompt = `请观察照片中的元素，并为每个物件加上有意义的手绘风注解。请填写照片中的物品(例:披萨、汽水[描写规则】·使用像白色笔画的细线手绘线条·一笔画风格、随性、略带不均匀感·沿着物件外围加上描边轮廓·用箭头或虚线做出视线引导[文字规则]·手写风格字体(日系可爱感)·句子简短、像自言自语的小碎念·语气偏日记感、带一点情绪[注解生成规则】·饮料一>味道、温度、心情(例:清爽、微甜、刚刚好)·食物一>口感、好吃程度(例:松软、超好·空间一>氛围(例:很放松、喜欢这种感·整体一>一句总结(例:今天有点幸福~)[装饰)·适度加入热气、闪光、爱心、星星、小表情等元素。不要过度装饰，保留空白空间。`;

    createApp({
      data() {
        return {
          RH: {
            baseUrl: '',
            uploadPath: '/api/upload',
            createPath: '/api/create',
            outputsPath: '/api/outputs',
            workflowId: '2052767492019367937',
            textNodeId: '1',
            textFieldName: 'text',
            imageNodeId: '4',
            imageFieldName: 'image',
            apiKey: ''
          },

          stylePresets: [
            {
              key: 'cute',
              label: '日系可爱',
              text: defaultPrompt,
              cover: 'https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?auto=format&fit=crop&w=700&q=80'
            },
            {
              key: 'food',
              label: '美食手绘',
              text: '请观察照片中的美食元素，为每道菜品加上手绘风注解。使用白色笔画细线手绘线条，一笔画风格。沿食物外围加描边轮廓，用箭头指向细节。手写风格字体，句子简短有趣。食物注重视感、口感描述（例：酥脆、多汁、入口即化）。适度加入热气、闪光、爱心装饰。',
              cover: 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=700&q=80'
            },
            {
              key: 'travel',
              label: '旅行手账',
              text: '请观察照片中的旅行元素，为每个场景加上手账风注解。使用白色笔画细线手绘线条，一笔画风格。沿建筑/风景外围加描边轮廓，用虚线连接相关元素。手写字体偏旅行日记感，句子简短有情绪（例：终于到了！、好震撼、想永远留在这里）。适度加入星星、云朵装饰。',
              cover: 'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=700&q=80'
            },
            {
              key: 'minimal',
              label: '极简标注',
              text: '请观察照片中的元素，仅对主要物件做极简手绘标注。使用极细白色线条，只在最突出的1-2个物品上加轮廓。文字极简，每件物品只写2-3个字（例：好喝、暖的）。不加多余装饰，留出大量空白。风格克制、高级。',
              cover: 'https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=700&q=80'
            }
          ],

          selectedStyle: 'cute',
          promptText: defaultPrompt,

          imageFile: null,
          imagePreview: '',
          imageName: '未选择照片',

          status: 'ready',
          statusText: 'READY',
          taskId: '',

          history: [],
          previewOpen: false,
          previewUrl: ''
        };
      },
      computed: {
        statusClass() {
          if (this.status === 'success') return 'ok';
          if (this.status === 'failed') return 'danger';
          return '';
        }
      },
      watch: {
        selectedStyle(key) {
          const preset = this.stylePresets.find(x => x.key === key);
          if (preset) this.promptText = preset.text;
        }
      },
      methods: {
        boxBg(url) {
          return url ? { backgroundImage: `url(${url})` } : {};
        },
        resetPrompt() {
          const preset = this.stylePresets.find(x => x.key === this.selectedStyle);
          this.promptText = preset ? preset.text : defaultPrompt;
        },
        getApiKey() { return ''; },
        async parseJsonSafe(resp) {
          const text = await resp.text();
          try { return JSON.parse(text); } catch (_) { return { raw: text }; }
        },
        async uploadFileToRunningHub(file) {
          const form = new FormData();
          form.append('file', file);
          form.append('fileType', 'input');
          const res = await fetch(`${this.RH.baseUrl}${this.RH.uploadPath}`, {
            method: 'POST', body: form
          });
          const data = await this.parseJsonSafe(res);
          if (!res.ok) throw new Error(`上传失败(${res.status}) ${JSON.stringify(data)}`);
          return data?.data?.fileUrl || data?.data?.fileName || data?.data?.filename || data?.data?.download_url || data?.data?.downloadUrl || '';
        },
        async createTask(nodeInfoList) {
          const res = await fetch(`${this.RH.baseUrl}${this.RH.createPath}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ workflowId: this.RH.workflowId, nodeInfoList })
          });
          const data = await this.parseJsonSafe(res);
          if (!res.ok || data?.code !== 0) throw new Error(`创建任务失败: ${JSON.stringify(data)}`);
          return data?.data?.taskId || '';
        },
        async pollOutputs(taskId) {
          for (let i = 0; i < 1200; i++) {
            const res = await fetch(`${this.RH.baseUrl}${this.RH.outputsPath}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ taskId })
            });
            const data = await this.parseJsonSafe(res);
            if (!res.ok) throw new Error(`查询失败(${res.status})`);
            if (data?.code === 0 && Array.isArray(data?.data) && data.data.length > 0) {
              const urls = [];
              (function walk(x) {
                if (!x) return;
                if (typeof x === 'string' && /^https?:\/\//i.test(x)) { urls.push(x); return; }
                if (Array.isArray(x)) x.forEach(walk);
                else if (typeof x === 'object') Object.values(x).forEach(walk);
              })(data);
              return urls;
            }
            if (data?.code === 805) throw new Error(`任务失败: ${JSON.stringify(data)}`);
            await new Promise((r) => setTimeout(r, 3000));
          }
          throw new Error('轮询超时');
        },
        onImageChange(e) {
          const f = e.target.files && e.target.files[0];
          this.imageFile = f || null;
          this.imageName = f ? f.name : '未选择照片';
          if (!f) return;
          if (this.imagePreview && this.imagePreview.startsWith('blob:')) URL.revokeObjectURL(this.imagePreview);
          this.imagePreview = URL.createObjectURL(f);
        },
        async runWorkflow() {
          try {
            if (!this.imageFile) throw new Error('请先上传照片');
            const prompt = (this.promptText || '').trim();
            if (!prompt) throw new Error('提示词不能为空');

            this.status = 'running';
            this.statusText = 'RUNNING';
            this.taskId = '';

            const imageRef = await this.uploadFileToRunningHub(this.imageFile);

            const nodeInfoList = [
              { nodeId: this.RH.textNodeId, fieldName: this.RH.textFieldName, fieldValue: prompt },
              { nodeId: this.RH.imageNodeId, fieldName: this.RH.imageFieldName, fieldValue: imageRef }
            ];

            const taskId = await this.createTask(nodeInfoList);
            this.taskId = taskId;
            const urls = await this.pollOutputs(taskId);
            const imageUrls = urls.filter((u) => /\.(png|jpe?g|webp|gif)(\?|$)/i.test(u));
            const first = imageUrls[0] || urls[0];
            if (!first) throw new Error('未返回图片结果');

            this.history = [
              { id: `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`, url: first, createdAt: Date.now() },
              ...this.history.filter((x) => x.url !== first)
            ].slice(0, 60);
            this.status = 'success';
            this.statusText = 'SUCCESS';
          } catch (e) {
            this.status = 'failed';
            this.statusText = e.message || String(e);
          }
        },
        openPreview(url) {
          if (!url) return;
          this.previewUrl = url;
          this.previewOpen = true;
        },
        closePreview() {
          this.previewOpen = false;
          this.previewUrl = '';
        },
        formatTime(ts) {
          const d = new Date(ts);
          const p = (n) => String(n).padStart(2, '0');
          return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
        }
      },
      mounted() {
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') this.closePreview();
        });
      }
    }).mount('#app');
  </script>
</body>
</html>
